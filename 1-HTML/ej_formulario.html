<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>
<!--Cree un Formulario con los campos que se proponen a continuacion-->
<!--Agregue el atributo legend-->

<!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

<h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>
<form>
        <legend>Formulario de Suscripcion</legend>
        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre">
        </p>
        <p>
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" placeholder="Ingrese su apellido">
        </p>
        <p>
            <label>Sexo:</label>
            <label for="masculino">Masculino</label>
            <input type="radio" id="masculino" name="sexo" value="masculino">
            <label for="femenino">Femenino</label>
            <input type="radio" id="femenino" name="sexo" value="femenino">
        </p>
        <p>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" placeholder="Ingrese su edad">
        </p>
        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Ingrese su email">
        </p>
        <p>
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario">
        </p>
        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Ingrese su password">
        </p>
        <p>
            <label for="confirm_password">Confirmar Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirme su password">
        </p>
        <p>
            <label for="tipo_servicio">Tipo de servicio:</label>
            <select id="tipo_servicio" name="tipo_servicio">
                <option value="free">Free</option>
                <option value="standard">Standard</option>
                <option value="premium">Premium</option>
            </select>
        </p>
        <p>
            <label>Tema:</label>
            <label for="politica">Política</label>
            <input type="checkbox" id="politica" name="tema" value="politica">
            <label for="negocios">Negocios</label>
            <input type="checkbox" id="negocios" name="tema" value="negocios">
            <label for="tecnologia">Tecnología</label>
            <input type="checkbox" id="tecnologia" name="tema" value="tecnologia">
            <label for="salud">Salud</label>
            <input type="checkbox" id="salud" name="tema" value="salud">
        </p>
        <p>
            <label for="comentario">Agregue un comentario:</label><br>
            <textarea id="comentario" name="comentario" placeholder="Escriba su comentario aquí..." </textarea>
        </p>
        <p><input type="submit" value="Enviar"></p>
</form>
</body>
</html>
